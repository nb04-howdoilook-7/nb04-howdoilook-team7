tags:
  - name: Images
    description: 이미지 업로드 관련 API

paths:
  /images:
    post:
      tags:
        - Images
      summary: 이미지 업로드
      description: 스타일이나 프로필에 사용될 이미지를 서버에 업로드하고 URL을 반환받습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 업로드할 이미지 파일
      responses:
        '201':
          description: 이미지 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 10
                  url:
                    type: string
                    format: uri
                    example: 'https://res.cloudinary.com/demo/image/upload/v1620310898/sample.jpg'
        '400':
          $ref: '#/components/schemas/ErrorResponse_BadRequest'
        '401':
          $ref: '#/components/schemas/ErrorResponse_Unauthorized'
