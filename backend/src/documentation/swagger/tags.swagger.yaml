tags:
  - name: Tags
    description: 태그 관련 API

paths:
  /styles/tags:
    get:
      tags:
        - Tags
      summary: 인기 태그 목록 조회
      description: 사용자들이 많이 사용하는 인기 태그 목록을 조회합니다. (주로 검색 자동완성에 사용)
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
          description: 검색할 태그 키워드
      responses:
        '200':
          description: 태그 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
