tags:
  - name: Curations
    description: 큐레이션 관련 API

paths:
  /styles/{styleId}/curations:
    get:
      tags:
        - Styles
      summary: 특정 스타일의 큐레이션 목록 조회
      description: styleId에 해당하는 스타일의 큐레이션 목록을 조회합니다.
      parameters:
        - in: path
          name: styleId
          required: true
          schema:
            type: integer
          description: 스타일의 고유 ID
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 큐레이션 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  curations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Curation'
                  totalPage:
                    type: integer
                    example: 2
        '404':
          $ref: '#/components/schemas/ErrorResponse_NotFound'

    post:
      tags:
        - Styles
      summary: 특정 스타일에 큐레이션 작성
      description: styleId에 해당하는 스타일에 새로운 큐레이션을 작성합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: styleId
          required: true
          schema:
            type: integer
          description: 스타일의 고유 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: '이 스타일 정말 멋져요!'
                trendy:
                  type: integer
                  example: 5
                personality:
                  type: integer
                  example: 5
                practicality:
                  type: integer
                  example: 3
                costEffectiveness:
                  type: integer
                  example: 4
      responses:
        '201':
          description: 큐레이션 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curation'
        '400':
          $ref: '#/components/schemas/ErrorResponse_BadRequest'
        '401':
          $ref: '#/components/schemas/ErrorResponse_Unauthorized'
        '404':
          $ref: '#/components/schemas/ErrorResponse_NotFound'

  /curations/{id}:
    put:
      tags:
        - Curations
      summary: 특정 큐레이션 수정
      description: ID에 해당하는 큐레이션을 수정합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/schemas/IdPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curation'
      responses:
        '200':
          description: 큐레이션 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curation'
        '400':
          $ref: '#/components/schemas/ErrorResponse_BadRequest'
        '401':
          $ref: '#/components/schemas/ErrorResponse_Unauthorized'
        '403':
          $ref: '#/components/schemas/ErrorResponse_Forbidden'
        '404':
          $ref: '#/components/schemas/ErrorResponse_NotFound'

    delete:
      tags:
        - Curations
      summary: 특정 큐레이션 삭제
      description: ID에 해당하는 큐레이션을 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/schemas/IdPathParameter'
      responses:
        '200':
          $ref: '#/components/schemas/SuccessResponse_OK'
        '401':
          $ref: '#/components/schemas/ErrorResponse_Unauthorized'
        '403':
          $ref: '#/components/schemas/ErrorResponse_Forbidden'
        '404':
          $ref: '#/components/schemas/ErrorResponse_NotFound'
